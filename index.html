    <!-- Boot splash "Shanyraq Draw" (25.11.2026). Shown from the first frame, before any script; the app keeps it
         while it starts (src/utils/bootSplash.ts) and fades it out when the first real screen is ready — but never
         before the intro (draw → fill → name, ~2.25 s) and one more second of the glow on the line have played (owner's request). While still loading after
         the intro, the mark stands still and the glow glides left and right along the line.
         The mark is public/brand/shanyraq-mark.svg (geometry unchanged; e2e/loading-screen.spec.ts checks the copy). -->
    <style>
      .shq-splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 24px; color: #d2be9c; opacity: 1; transition: opacity 280ms ease;
        background: radial-gradient(60% 45% at 50% 42%, rgba(210, 190, 156, 0.075), rgba(210, 190, 156, 0) 70%),
                    radial-gradient(120% 90% at 50% 50%, #1d1918 0%, #191615 55%, #120f0e 100%); }
      .shq-splash.is-leaving { opacity: 0; pointer-events: none; }
      .shq-splash.is-late { animation: shq-splash-in 220ms ease-out 150ms both; }
      .shq-splash-stage { display: flex; flex-direction: column; align-items: center; }
      .shq-mark { width: min(34vw, 132px); height: auto; overflow: visible; }
      .shq-mark-draw path { fill: none; stroke: #d2be9c; stroke-width: 3.4; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: shq-draw 950ms cubic-bezier(0.55, 0, 0.3, 1) calc(280ms + var(--i) * 85ms) both,
                   shq-stroke-out 450ms ease 1750ms both; }
      .shq-mark-draw path:first-child { animation-duration: 1100ms, 400ms; animation-delay: 0ms, 1750ms; }
      .shq-mark-fill { fill: #d2be9c; opacity: 0; animation: shq-fade 600ms ease 1150ms both; }
      .shq-name { margin: 26px 0 0; padding-left: 0.34em; font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.34em; color: #e7d9bf; opacity: 0; animation: shq-rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) 650ms both; }
      .shq-bar { position: relative; width: 88px; height: 2px; margin-top: 22px; border-radius: 2px; overflow: hidden;
        background: rgba(210, 190, 156, 0.14); opacity: 0; animation: shq-fade 500ms ease 1100ms both; }
      .shq-bar i { position: absolute; inset: 0 auto 0 0; width: 38%; border-radius: 2px;
        background: linear-gradient(90deg, rgba(210, 190, 156, 0), #f1e4c8 50%, rgba(210, 190, 156, 0));
        animation: shq-sweep 1700ms ease-in-out infinite alternate; }
      .shq-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .shq-stuck { margin-top: 28px; max-width: 260px; text-align: center; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #b8ad9f; }
      .shq-stuck button { margin-top: 12px; min-height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(210, 190, 156, 0.45);
        background: rgba(210, 190, 156, 0.1); color: #e7d9bf; font: inherit; font-weight: 600; cursor: pointer; }
      @keyframes shq-draw { to { stroke-dashoffset: 0; } }
      @keyframes shq-stroke-out { to { stroke-opacity: 0; } }
      @keyframes shq-fade { to { opacity: 1; } }
      @keyframes shq-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      /* Waiting: the glow glides left and right along the line (no progress is implied). */
      @keyframes shq-sweep { from { transform: translateX(-45%); } to { transform: translateX(208%); } }
      @keyframes shq-splash-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .shq-mark-draw { display: none; }
        .shq-mark-fill, .shq-name { animation: none; opacity: 1; transform: none; }
        .shq-bar { display: none; }
        .shq-splash, .shq-splash.is-late { animation: none; transition: none; }
      }
    </style>

        <p class="shq-name">SHANYRAQ HUB</p>
        <div class="shq-bar"><i></i></div>
      </div>
      <span class="shq-sr" role="progressbar" data-splash-label>Жүктелуде…</span>
      <div class="shq-stuck" data-splash-stuck hidden>
        <span data-splash-stuck-text></span><br />
        <button type="button" onclick="location.reload()" data-splash-stuck-button></button>
      </div>
    </div>
    <script>
      // Splash texts in the saved language (Kazakh by default) and the safety net: if the app has not started
      // after 20 s (no connection, a failed file), say so and offer a reload instead of an endless animation.
      (function () {
        var T = {
          kz: ['Жүктелуде…', 'Жүктеу ұзаққа созылды. Интернетті тексеріп, бетті жаңартыңыз.', 'Жаңарту'],
          ru: ['Загрузка…', 'Загрузка затянулась. Проверьте интернет и обновите страницу.', 'Обновить'],
          en: ['Loading…', 'This is taking too long. Check your connection and reload the page.', 'Reload']
        };
        window.__shqSplash = {
          localize: function (el) {
            var l = 'kz';
            try { var s = localStorage.getItem('shanyraq_lang'); if (s === 'ru' || s === 'en') l = s; } catch (e) {}
            el.querySelector('[data-splash-label]').textContent = T[l][0];
            el.querySelector('[data-splash-label]').setAttribute('aria-label', T[l][0]);
            el.querySelector('[data-splash-stuck-text]').textContent = T[l][1];
            el.querySelector('[data-splash-stuck-button]').textContent = T[l][2];
          },
          armStuck: function (el) {
            return setTimeout(function () {
              if (el.isConnected && !el.classList.contains('is-leaving')) el.querySelector('[data-splash-stuck]').hidden = false;
            }, 20000);
          }
        };
        var el = document.getElementById('boot-splash');
        window.__shqSplash.localize(el);
        el.setAttribute('data-start', String(performance.now())); // the intro is played in full from here
        window.__shqSplash.armStuck(el);
      })();
    </script>

        });
      }
    </script>
